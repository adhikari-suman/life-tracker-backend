[versions]
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
archunit = "1.4.2"
liquibaseGradle = "3.1.0"
# Not BOM-managed (the migrations module has no Spring BOM), so pinned explicitly.
# postgresql + liquibase are aligned with the Spring Boot 4.1.0 platform.
liquibase = "4.33.0"
postgresql = "42.7.7"
picocli = "4.7.7"
# Not managed by the Spring Boot BOM; Argon2 (via spring-security-crypto) needs it at runtime.
bouncycastle = "1.78.1"
# :domain has no Spring BOM to supply a version, so JUnit is pinned here. Kept equal to what
# the Boot 4.1.0 BOM resolves in :infrastructure, so both modules use the same JUnit.
junit = "6.0.3"

[libraries]
# Spring Boot starters — versions supplied by the Boot BOM via io.spring.dependency-management.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
# Security / crypto (Argon2id). Versions supplied by the Boot BOM.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Spring Boot's Liquibase auto-configuration (Boot 4 modular autoconfig). Brings liquibase-core
# transitively; added test-only so the Testcontainers boot runs the :migrations changelog.
spring-boot-liquibase = { module = "org.springframework.boot:spring-boot-liquibase" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
# Explicitly versioned.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
liquibase = { id = "org.liquibase.gradle", version.ref = "liquibaseGradle" }
