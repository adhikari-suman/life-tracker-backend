# Host-side development: the app runs from `bootRun` while compose supplies only its dependencies.
#
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=local ./gradlew :infrastructure:bootRun
#
# These are the values application.properties deliberately leaves undefaulted, supplied for the one
# case where the answer is genuinely known in advance. The reasoning there still holds: a default
# datasource does not fail, it connects to the wrong thing — which is why these live behind an
# explicitly named profile rather than in the base file. Nothing reads them unless you ask for them.
#
# Values mirror the anchors in compose.yaml. Two file formats, so they cannot share a definition.

spring.datasource.url=jdbc:postgresql://localhost:5432/lifetracker
# The same unprivileged role the container uses, so the two-role split (ADR-0016) is exercised in
# the loop you spend the day in, not only in the tests and the full stack.
spring.datasource.username=lifetracker_app
spring.datasource.password=app-local-only

# Relative to Gradle's working directory for :infrastructure:bootRun, which is the module
# directory. The keypair the `keygen` service writes lives at the repository root.
app.jwt.private-key=file:../.secrets/jwt-private.pem
app.jwt.public-key=file:../.secrets/jwt-public.pem
