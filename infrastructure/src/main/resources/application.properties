spring.application.name=life-tracker-backend

# The API is served under /v1, matching the `servers` base URL in the contract. The prefix belongs
# to the application, not to a gateway in front of it (ADR-0017).
server.servlet.context-path=/v1

# Deliberately undefaulted. The app declares that it requires a database and fails at startup
# naming the missing value, rather than defaulting to a host that may not be the one you meant —
# a default datasource does not fail, it connects to the wrong thing. Supplied by compose; set
# them in the environment for `./gradlew :infrastructure:bootRun`.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate never writes DDL — it validates against the Liquibase-migrated schema (ADR-0009).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Request bodies are strict: a field the schema does not declare — usually a typo — is REJECTED, not
# silently dropped. The contract's `additionalProperties: false` made that promise, and this is where
# the backend keeps it. A dropped field is the worst kind of bug: it compiles, sends, and does nothing.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Login brute-force throttle (ADR-0010): at most max-attempts failed logins per email within the
# trailing window, after which /auth/login answers 429 until the window drains.
app.auth.login.max-attempts=10
app.auth.login.window=1h

# Account one-time token lifetimes (ADR-0011): verification links live longer than the more
# sensitive password-reset links.
app.auth.tokens.verification-ttl=P1D
app.auth.tokens.password-reset-ttl=PT1H

# RS256 signing (ADR-0007). The keypair is supplied from OUTSIDE the application — mounted at
# /keys by compose locally, by whatever a deployment uses for secrets otherwise. The app never
# generates its own signing key. Unlike the datasource these paths carry a default: a wrong path
# fails at startup with the path in the message, where a wrong datasource silently succeeds
# against the wrong database.
app.jwt.private-key=${JWT_PRIVATE_KEY:file:/keys/jwt-private.pem}
app.jwt.public-key=${JWT_PUBLIC_KEY:file:/keys/jwt-public.pem}
app.jwt.issuer=${JWT_ISSUER:http://localhost:8080/v1}
app.jwt.access-token-ttl=15m

# Actuator on its own port, so health is not served under the versioned API prefix — health is not
# part of the contract. Note that a separate port is NOT a separate filter chain: Boot propagates
# SecurityConfig to the management context, which is why SecurityConfig carries an explicit chain
# permitting the health endpoint. 8081 is not published to the host; it is reachable inside the
# compose network, and on Kubernetes to the kubelet running the probes.
management.server.port=8081
management.endpoints.web.exposure.include=health
# Adds /actuator/health/liveness and /actuator/health/readiness, which differ: readiness goes UP
# only once the app is actually serving. The container healthcheck targets readiness.
management.endpoint.health.probes.enabled=true
# Safe here because nothing untrusted shares this network. NOT safe on a cluster: an unpublished
# port is not access control, and anything that can route to the pod reads these diagnostics.
# Becomes `when-authorized` if this is ever deployed.
management.endpoint.health.show-details=always
