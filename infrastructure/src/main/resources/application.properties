spring.application.name=life-tracker-backend

# Hibernate never writes DDL — it validates against the Liquibase-migrated schema (ADR-0009).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Request bodies are strict: a field the schema does not declare — usually a typo — is REJECTED, not
# silently dropped. The contract's `additionalProperties: false` made that promise, and this is where
# the backend keeps it. A dropped field is the worst kind of bug: it compiles, sends, and does nothing.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Login brute-force throttle (ADR-0010): at most max-attempts failed logins per email within the
# trailing window, after which /auth/login answers 429 until the window drains.
app.auth.login.max-attempts=10
app.auth.login.window=1h

# Account one-time token lifetimes (ADR-0011): verification links live longer than the more
# sensitive password-reset links.
app.auth.tokens.verification-ttl=P1D
app.auth.tokens.password-reset-ttl=PT1H
