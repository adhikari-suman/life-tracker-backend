# The codebase is greenfield: domain/application are still empty, so several
# ArchUnit rules currently match zero classes (no @Entity types, no *Repository
# ports, no domain classes, no fields at all). ArchUnit 1.x defaults
# failOnEmptyShould=true, which would fail the build on an empty rule. Disable that
# so the guards pass now and still fire the moment real code is added.
archRule.failOnEmptyShould=false
