# Two jobs, deliberately separate, because they fail for different reasons and catch different
# things.
#
#   tests  — the Gradle suite. Owns the units and the persistence.
#   smoke  — the assembled application over HTTP, against the spec.
#
# The split is the point. Nothing in Java reads openapi.yaml, so `gradle test` structurally cannot
# notice the API drifting from the contract — and it didn't: a `time` serialized as 19:42:00 against
# the spec's HH:mm pattern, and a missing required field NPE'ing into a 500, were both live while
# the whole suite was green. The smoke job is the net for the next one.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    name: gradle test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 25 is not a preference: build.gradle.kts pins JavaLanguageVersion.of(25), and the toolchain
      # will refuse to resolve against anything else.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers, never H2 — it accepts decimal types it does not implement faithfully and
      # would pass tests that production fails. The runner's Docker daemon is what makes this work.
      - name: test
        run: ./gradlew test --no-daemon

      - name: publish the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          retention-days: 7

  smoke:
    name: smoke (api + database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker Hub times out from GitHub runners often enough that a single attempt makes this job
      # flaky for reasons that have nothing to do with the code. Pull first, with retries, so a
      # registry hiccup costs a retry instead of a red build somebody learns to ignore.
      - name: pull base images (retrying past registry flakiness)
        run: |
          for image in postgres:18-alpine alpine/openssl liquibase/liquibase:4.33.0-alpine; do
            for attempt in 1 2 3; do
              docker pull "$image" && break
              echo "pull of $image failed (attempt $attempt/3), retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
              [ "$attempt" = 3 ] && { echo "::error::could not pull $image"; exit 1; }
            done
          done

      # Brings up postgres, generates the signing keypair, applies every migration to an EMPTY
      # database, and starts the app. Migrating from zero is itself worth having in CI: it is the
      # path a fresh environment takes and the one least often exercised locally.
      - name: bring the stack up
        run: docker compose up -d --build --scale app=1

      - name: wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' life-tracker-backend-app-1 2>/dev/null || echo starting)
            [ "$status" = healthy ] && { echo "healthy after ${i}0s"; exit 0; }
            sleep 10
          done
          echo "::error::the app never became healthy"
          docker compose logs --no-color app | tail -50
          exit 1

      - name: smoke
        run: ./smoke/run.sh

      - name: application logs when it fails
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: tear down
        if: always()
        run: docker compose down -v
